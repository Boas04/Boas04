name: Generate contribution snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Boas04
          outputs: |
            dist/github-snake.svg?color_snake=%23D8475B&color_dots=%23EBEDF0,%23F5BAC2,%23E98A98,%23CE586B,%23882A40
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF667A&color_dots=%23161B22,%234A2532,%237C3447,%23AE4259,%23E05A6A

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
